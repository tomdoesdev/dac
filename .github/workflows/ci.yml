name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # DAC targets Unix. proclock carries a unix build constraint, so a
        # Windows job would fail to build rather than fail a test.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build ./...

  # Analysis is the same on either operating system, so it runs once rather
  # than in the matrix beside a suite that genuinely differs per platform.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Both tools are built here rather than downloaded. A released binary is
      # built with whatever Go that release used, and a linter refuses a module
      # targeting a newer language version than the one it was built with --
      # so a prebuilt golangci-lint fails on this repository with a message
      # about its own toolchain. Installing it against go.mod's Go builds it
      # with the version the project targets.
      - name: Install analysis tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Lint
        run: golangci-lint run ./...

      # Reports known vulnerabilities in the dependencies and in the Go
      # toolchain itself, limited to the ones DAC actually reaches.
      - name: Vulnerabilities
        run: govulncheck ./...
