[tasks.build]
description = "Build DAC in the project bin directory."
run = "mkdir -p bin && go build -o bin/dac ./cmd/dac"

[tasks.test]
description = "Run all Go tests with the race detector."
run = "go test -race ./..."

[tasks.cover]
description = "Report test coverage for each package."
run = "go test -cover ./..."

[tasks.vet]
description = "Run go vet over all packages."
run = "go vet ./..."

[tasks.format]
description = "Format all Go packages."
run = "go fmt ./..."

[tasks.fix]
description = "Apply the Go modernizers."
run = "go fix ./..."

# Both tools are installed rather than downloaded, and pinned to the versions
# CI uses. A released binary is built with whatever Go that release used, and a
# linter refuses a module targeting a newer language version than its own -- so
# a prebuilt golangci-lint fails here talking about its own toolchain instead
# of about this code.
[tasks.tools]
description = "Install the analysis tools at the versions CI pins."
run = """
go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
"""

[tasks.lint]
description = "Run the linters over all packages."
run = "golangci-lint run ./..."

[tasks.vuln]
description = "Report known vulnerabilities DAC reaches."
run = "govulncheck ./..."

[tasks.check]
description = "Run the checks that CI runs."
depends = ["vet", "lint", "vuln", "test"]
